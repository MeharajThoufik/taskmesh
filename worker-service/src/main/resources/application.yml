spring:
  application:
    name: worker-service
  datasource:
    # Local default targets the Docker Postgres remapped to host port 5433 over IPv4.
    # In Docker (Phase 7) this is overridden via POSTGRES_URL=jdbc:postgresql://postgres:5432/taskmesh
    url: ${POSTGRES_URL:jdbc:postgresql://127.0.0.1:5433/taskmesh}
    username: ${POSTGRES_USER:taskmesh}
    password: ${POSTGRES_PASSWORD:taskmesh123}
  jpa:
    # Schema is owned by init.sql (CLAUDE.md §5). Hibernate must never touch DDL.
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  data:
    redis:
      # 127.0.0.1 (IPv4) targets the Docker Redis proxy; avoids a native IPv6 ::1 listener.
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Worker identity and claim-loop tuning.
worker:
  id: ${WORKER_ID:worker-local}
  batch-size: 10
  poll-interval-ms: 1000
  kafka-group-id: taskmesh-workers

logging:
  level:
    com.taskmesh: INFO
