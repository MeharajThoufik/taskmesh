# TaskMesh — Phase 1 infrastructure
#
# Brings up the backing services: PostgreSQL, Redis, Kafka, Zookeeper.
# The producer-service and worker-service entries (Section 8 of CLAUDE.md) are added
# in their own phases once those modules and Dockerfiles exist — including them now
# would make `docker-compose up` fail on the missing build contexts.
#
# Usage:
#   docker-compose up -d
#   docker-compose ps        # all services should report healthy

services:
  postgres:
    image: postgres:15
    container_name: taskmesh-postgres
    environment:
      POSTGRES_DB: taskmesh
      POSTGRES_USER: taskmesh
      POSTGRES_PASSWORD: taskmesh123
    # Host port 5433 (not 5432) to avoid colliding with a native PostgreSQL already
    # listening on the host's 5432. The container still listens on 5432 internally, so
    # in-Docker service-to-service connections (Phase 7) are unaffected.
    ports:
      - "5433:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskmesh -d taskmesh"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: taskmesh-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: taskmesh-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      # 'ruok' is not in the default 4lw whitelist; 'srvr' is enabled out of the box.
      test: ["CMD-SHELL", "echo srvr | nc localhost 2181 | grep -q Mode"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: taskmesh-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 5

volumes:
  postgres-data:
