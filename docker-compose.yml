# TaskMesh — full stack (Part 1)
#
# Infra (PostgreSQL, Redis, Kafka, Zookeeper) + the application services:
# producer-service and 3 worker replicas. One command brings everything up.
#
# Usage:
#   ./mvnw clean package          # build the service jars first (Dockerfiles copy them in)
#   docker compose up -d --build  # build images + start the whole stack
#   docker compose ps             # all services should report healthy/running

services:
  postgres:
    image: postgres:15
    container_name: taskmesh-postgres
    environment:
      POSTGRES_DB: taskmesh
      POSTGRES_USER: taskmesh
      POSTGRES_PASSWORD: taskmesh123
    # Host port 5433 (not 5432) to avoid colliding with a native PostgreSQL already
    # listening on the host's 5432. The container still listens on 5432 internally, so
    # in-Docker service-to-service connections (Phase 7) are unaffected.
    ports:
      - "5433:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskmesh -d taskmesh"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: taskmesh-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: taskmesh-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      # 'ruok' is not in the default 4lw whitelist; 'srvr' is enabled out of the box.
      test: ["CMD-SHELL", "echo srvr | nc localhost 2181 | grep -q Mode"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: taskmesh-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # Two listeners: INTERNAL for in-Docker clients (advertised as kafka:29092) and
      # EXTERNAL for host clients (advertised as localhost:9092). Containerized services
      # use kafka:29092; tooling on the host uses localhost:9092.
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 5

  # Task intake REST API (port 8081 on host).
  producer-service:
    build:
      context: ./producer-service
    image: taskmesh/producer-service:1.0.0
    container_name: taskmesh-producer
    ports:
      - "8081:8081"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JAVA_TOOL_OPTIONS: "-Xmx256m"
    depends_on:
      kafka:
        condition: service_healthy

  # 3 worker replicas to simulate a distributed pool. No restart policy: a killed worker
  # stays down so dead-detection on the survivors can reclaim its tasks (Phase 7 test).
  worker-service-1:
    build:
      context: ./worker-service
    image: taskmesh/worker-service:1.0.0
    container_name: taskmesh-worker-1
    environment:
      WORKER_ID: worker-1
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      POSTGRES_URL: jdbc:postgresql://postgres:5432/taskmesh
      REDIS_HOST: redis
      JAVA_TOOL_OPTIONS: "-Xmx256m"
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # -2 and -3 reuse the image built by worker-service-1 (same Dockerfile) — no rebuild.
  worker-service-2:
    image: taskmesh/worker-service:1.0.0
    container_name: taskmesh-worker-2
    environment:
      WORKER_ID: worker-2
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      POSTGRES_URL: jdbc:postgresql://postgres:5432/taskmesh
      REDIS_HOST: redis
      JAVA_TOOL_OPTIONS: "-Xmx256m"
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker-service-3:
    image: taskmesh/worker-service:1.0.0
    container_name: taskmesh-worker-3
    environment:
      WORKER_ID: worker-3
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      POSTGRES_URL: jdbc:postgresql://postgres:5432/taskmesh
      REDIS_HOST: redis
      JAVA_TOOL_OPTIONS: "-Xmx256m"
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres-data:
